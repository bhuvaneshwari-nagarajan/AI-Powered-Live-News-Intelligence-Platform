<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1526;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3060;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#heroGrad)"/>
  <rect x="0" y="0" width="800" height="3" fill="#e02b45"/>
  <!-- Globe decoration -->
  <circle cx="600" cy="200" r="160" stroke="#2a6fe8" stroke-width="1" fill="none" opacity="0.08"/>
  <circle cx="600" cy="200" r="120" stroke="#2a6fe8" stroke-width="1" fill="none" opacity="0.06"/>
  <ellipse cx="600" cy="200" rx="65" ry="160" stroke="#2a6fe8" stroke-width="0.8" fill="none" opacity="0.08"/>
  <line x1="440" y1="200" x2="760" y2="200" stroke="#2a6fe8" stroke-width="0.8" opacity="0.08"/>
  <!-- NewsSphere text watermark -->
  <text x="200" y="200" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#ffffff" opacity="0.08">NewsSphere</text>
  <text x="200" y="248" font-family="system-ui,sans-serif" font-size="16" fill="#ffffff" opacity="0.06">AI-Powered Live News Intelligence</text>
  <!-- Demo label -->
  <rect x="20" y="20" width="220" height="28" rx="4" fill="#e02b4520"/>
  <text x="130" y="39" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#f07a8a" letter-spacing="1">FEATURED NEWS · DEMO IMAGE</text>
  <text x="400" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#3a404e">[Demo hero placeholder — real images would replace this]</text>
</svg>
